name: 取 Proton 凭据

on:
  workflow_dispatch:
  # 改脚本或工作流时自动跑一次，改完立刻能验证，不用手动点
  push:
    paths:
      - '.github/workflows/proton.yml'
      - 'scripts/gen_proton.py'
  # 证书 7 天到期。注意 cron 的 */6 是"日期能被 6 整除"，不是"每隔 6 天"，
  # 月末衔接会不均匀。取每 3 天跑一次，失败一次也还有余量。
  schedule:
    - cron: '0 3 */3 * *'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 装依赖
        run: |
          set -euo pipefail
          # 官方库自带 SRP 实现，不用自己写。
          # 它验 Modulus 的 PGP 签名要 gpg，runner 自带。
          pip install -q "git+https://github.com/ProtonVPN/python-proton-core.git" cryptography aiohttp
          gpg --version | head -1

      - name: 登录并生成凭据
        env:
          PROTON_USER: ${{ secrets.PROTON_USER }}
          PROTON_PASS: ${{ secrets.PROTON_PASS }}
          # 不注入 PROTON_APP_VERSION：脚本内置默认 4.19.1，登录前会先用
          # /auth/info 探测（5003 = 已退役）并自动往上换版本。仓库 Actions
          # variable 里那个 4.13.0 已过期且无需维护，别再让它进来当起点。
          # 真要手动指定版本，在 fork / 自跑时直接设同名环境变量即可。
        run: |
          set -euo pipefail
          if [ -z "${PROTON_USER:-}" ] || [ -z "${PROTON_PASS:-}" ]; then
            echo "缺 secrets。到 Settings > Secrets and variables > Actions"
            echo "加 PROTON_USER（Proton 邮箱）和 PROTON_PASS（密码）"
            exit 1
          fi
          python3 scripts/gen_proton.py dist

      - name: 推送到 Worker
        env:
          URL: ${{ secrets.WORKER_PUSH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${URL:-}" ]; then
            echo "没配 WORKER_PUSH_URL，跳过推送。凭据在 artifact 里，可手动粘贴。"
            exit 0
          fi
          # 令牌就在地址里，所以只需要这一个 secret
          CODE=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X POST "$URL" \
            --data-binary @dist/proton-blob.txt)
          echo "HTTP $CODE"
          cat /tmp/resp.json; echo
          # 404 = 令牌不对（故意不区分"路径不存在"和"没权限"）
          [ "$CODE" = "200" ] || { echo "推送失败"; exit 1; }

      - name: 摘要
        if: always()
        env:
          # 只把「有没有配推送地址」变成布尔值传进脚本，不把 secret 本身插进 shell。
          # 公开仓库的运行摘要所有人可见，绝不能把含 WireGuard 私钥的 blob 写进去。
          PUSH_CONFIGURED: ${{ secrets.WORKER_PUSH_URL != '' }}
        run: |
          {
            echo '## Proton 凭据'
            echo
            if [ ! -s dist/proton-blob.txt ]; then
              echo '生成失败，看上面的日志。'
            else
              echo '凭据已生成。'
              if [ "$PUSH_CONFIGURED" = 'true' ]; then
                echo '已自动推送到 Worker，配置随即更新。'
              else
                echo '没配 WORKER_PUSH_URL，未自动推送。到本页 Artifacts 下载 `proton-blob` 后手动粘贴。'
              fi
              echo
              echo '注意：凭据内含 WireGuard 私钥，不要贴进运行摘要、日志或聊天记录。'
              echo
              echo '证书 7 天有效，本流水线每 3 天自动跑一次，不用手动管。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: proton-blob
          path: dist/proton-blob.txt
          retention-days: 7
          if-no-files-found: error
