name: 生成 WARP MASQUE 配置

on:
  workflow_dispatch:
    inputs:
      device_name:
        description: 设备名（WARP 后台显示用）
        required: false
        default: gh-actions
      retention_days:
        description: artifact 保留天数
        required: false
        default: '7'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: 下载 usque
        run: |
          set -euo pipefail
          VER=$(curl -sL https://api.github.com/repos/Diniboy1123/usque/releases/latest \
                | jq -r '.tag_name' | sed 's/^v//')
          echo "usque 版本 $VER"
          curl -sL -o usque.zip \
            "https://github.com/Diniboy1123/usque/releases/download/v${VER}/usque_${VER}_linux_amd64.zip"
          unzip -oq usque.zip
          chmod +x usque
          # 没有 config.json 时 usque version 会先打一条 error，不影响结果
          ./usque version 2>/dev/null | grep -i version || true

      - name: 注册设备并生成密钥
        run: |
          set -euo pipefail
          ./usque register -a -n "${{ github.event.inputs.device_name || 'gh-actions' }}"
          test -s config.json
          # 只打印非敏感字段，密钥不进日志
          python3 - <<'PY'
          import json
          c = json.load(open("config.json"))
          print("endpoint_v4 =", c["endpoint_v4"])
          print("endpoint_v6 =", c["endpoint_v6"])
          print("内网地址 =", c["ipv4"], "/", c["ipv6"])
          PY

      - name: 生成 mihomo 配置
        run: python3 scripts/gen_masque.py config.json dist

      - name: 校验配置可加载
        run: |
          set -euo pipefail
          URL=$(curl -sL https://api.github.com/repos/MetaCubeX/mihomo/releases \
                | grep -o 'https://[^"]*mihomo-linux-amd64-alpha[^"]*\.gz' | head -1)
          curl -sL -o mihomo.gz "$URL"
          gunzip -f mihomo.gz
          chmod +x mihomo
          mkdir -p check
          cp dist/warp-masque.yaml check/config.yaml
          # -t 只做配置解析校验，不起服务
          ./mihomo -t -d check
          echo "配置校验通过"

      - name: 打包并加密凭据
        env:
          ARTIFACT_PASSPHRASE: ${{ secrets.ARTIFACT_PASSPHRASE }}
        run: |
          set -euo pipefail
          cp config.json dist/usque-config.json
          test -s dist/warp-masque.yaml
          test -s dist/warp-masque-shadowrocket.txt
          # 只列文件名，不打印内容
          ls -1 dist
          bash scripts/pack_encrypted.sh dist warp-masque-config.tar.gz.enc
          # artifact 只上传密文，明文目录不再保留
          rm -rf dist

      - name: 上传加密 artifact
        uses: actions/upload-artifact@v6
        with:
          name: warp-masque-config
          # 单个密文文件，公开可下载也不含明文私钥
          path: warp-masque-config.tar.gz.enc
          retention-days: ${{ github.event.inputs.retention_days || 7 }}
          if-no-files-found: error

      - name: 摘要
        if: always()
        run: |
          {
            echo '## WARP MASQUE 配置'
            echo
            if [ -s warp-masque-config.tar.gz.enc ]; then
              echo '加密包已生成，artifact 里只有密文，明文私钥不公开。'
              echo '下载后用仓库 secret ARTIFACT_PASSPHRASE 解密，命令见 README「4. 下载并解密」。'
            else
              echo '生成或加密失败，看上面的日志。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
